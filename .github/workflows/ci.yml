name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: winterchill-trading/infra/.github/actions/ox-setup@main
        with:
          pins: |
            fixed-decimal https://github.com/winterchill-trading/fixed-decimal.git
            exchange-core https://github.com/winterchill-trading/exchange-core.git
            parquet https://github.com/winterchill-trading/parquet.git
            market-data https://github.com/winterchill-trading/market-data.git
            backtest-stats https://github.com/winterchill-trading/backtest-stats.git
            hl-protocol https://github.com/winterchill-trading/hl-protocol.git
            venue-net https://github.com/winterchill-trading/venue-net.git
            hl-client https://github.com/winterchill-trading/hl-client.git
      - run: opam exec -- dune build
      - run: opam exec -- dune test
      # odoc does not declare result; the local switch only had it transitively.
      # listing the pins keeps the solver from dropping sibling packages
      - run: opam install -y result odoc $(opam pin list --short)
      - name: Build API docs (odoc warnings fail the step)
        env:
          ODOC_WARN_ERROR: "true"
        run: |
          set -o pipefail
          opam exec -- dune build @doc --display short 2>&1 | tee doc.log
          if grep -q "Warning" doc.log; then exit 1; fi
  obj-magic:
    uses: winterchill-trading/infra/.github/workflows/obj-magic.yml@main
